<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project for portfolio</title>
    <style>
        :root {
            --neon-red: #ff073a;
            --dark-bg: #050000;
            --glass-bg: rgba(255, 7, 58, 0.05);
            --glass-border: rgba(255, 7, 58, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background: linear-gradient(135deg, #4a0000 0%, var(--dark-bg) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
            padding: 10px; 
        }

        
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            
            padding: clamp(20px, 5vw, 40px); 
            width: 100%;
            max-width: 600px;
            box-shadow: 0 8px 32px 0 rgba(255, 7, 58, 0.15), inset 0 0 20px rgba(255, 7, 58, 0.05);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        
        .tabs {
            display: flex;
            justify-content: center;
            flex-wrap: wrap; 
            gap: 10px;
            margin-bottom: 30px;
        }

        .tab-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: clamp(0.7rem, 3vw, 1rem); 
        }

        .tab-btn:hover, .tab-btn.active {
            background: rgba(255, 7, 58, 0.2);
            box-shadow: 0 0 10px var(--neon-red);
            color: var(--neon-red);
            text-shadow: 0 0 5px var(--neon-red);
        }

        
        .tab-content {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .tab-content.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
            animation: slideIn 0.5s forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: scale(0.95) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        
        .time-display {
            
            font-size: clamp(2rem, 8vw, 4rem); 
            font-weight: bold;
            color: var(--neon-red);
            text-shadow: 0 0 10px var(--neon-red), 0 0 20px var(--neon-red), 0 0 40px #aa0000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap; 
            gap: 5px;
            margin: 30px 0;
        }

        .countdown-display {
            
            font-size: clamp(1.2rem, 5vw, 2.5rem); 
        }

        .digit-group {
            display: flex;
        }

        .digit {
            display: inline-block;
            
            min-width: 2ch; 
            perspective: 1000px;
            transform-style: preserve-3d;
            text-align: center;
        }

        
        .flip-anim {
            animation: flip 0.3s ease-in-out;
        }

        @keyframes flip {
            0% { transform: rotateX(0deg); opacity: 1; }
            50% { transform: rotateX(90deg); opacity: 0.5; }
            100% { transform: rotateX(0deg); opacity: 1; }
        }

        
        .controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        button.action-btn {
            background: transparent;
            border: 2px solid var(--neon-red);
            color: var(--neon-red);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: clamp(0.9rem, 3vw, 1.1rem);
            cursor: pointer;
            transition: 0.3s;
            text-shadow: 0 0 5px var(--neon-red);
            box-shadow: inset 0 0 10px rgba(255, 7, 58, 0.2);
        }

        button.action-btn:hover {
            background: var(--neon-red);
            color: var(--dark-bg);
            box-shadow: 0 0 15px var(--neon-red), 0 0 30px var(--neon-red);
            text-shadow: none;
        }

        .input-group {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        input[type="number"], input[type="datetime-local"] {
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--neon-red);
            color: var(--neon-red);
            padding: 8px;
            border-radius: 5px;
            outline: none;
            font-size: clamp(1rem, 3vw, 1.2rem);
            text-align: center;
            text-shadow: 0 0 5px var(--neon-red);
            max-width: 100%;
        }

        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }

        input[type="number"] { width: 60px; -moz-appearance: textfield; }

        
        .ambient-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,7,58,0.3) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
            animation: pulse 4s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0.8; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="glass-panel">
        <nav class="tabs">
            <button class="tab-btn active" onclick="switchTab('stopwatch-tab')">Stopwatch</button>
            <button class="tab-btn" onclick="switchTab('timer-tab')">Timer</button>
            <button class="tab-btn" onclick="switchTab('countdown-tab')">Countdown</button>
        </nav>

        <div id="stopwatch-tab" class="tab-content active">
            <div class="time-display">
              <div class="digit-group" id="sw-hrs"></div>
                <div class="digit-group" id="sw-min">00</div>:
                <div class="digit-group" id="sw-sec">00</div>:
                <div class="digit-group" id="sw-ms">00</div>
            </div>
            <div class="controls">
                <button class="action-btn" onclick="startStopwatch()">Start</button>
                <button class="action-btn" onclick="stopStopwatch()">Stop</button>
                <button class="action-btn" onclick="resetStopwatch()">Reset</button>
            </div>
        </div>

        <div id="timer-tab" class="tab-content">
            <div class="input-group">
                <input type="number" id="tm-h-in" placeholder="HH" min="0"> :
                <input type="number" id="tm-m-in" placeholder="MM" min="0" max="59"> :
                <input type="number" id="tm-s-in" placeholder="SS" min="0" max="59">
            </div>
            <div class="time-display">
                <div class="digit-group" id="tm-hr">00</div>:
                <div class="digit-group" id="tm-min">00</div>:
                <div class="digit-group" id="tm-sec">00</div>
            </div>
            <div class="controls">
                <button class="action-btn" onclick="startTimer()">Start</button>
                <button class="action-btn" onclick="stopTimer()">Stop</button>
                <button class="action-btn" onclick="resetTimer()">Reset</button>
            </div>
        </div>

        <div id="countdown-tab" class="tab-content">
            <div class="input-group">
                <input type="datetime-local" id="cd-date">
            </div>
            <div class="time-display countdown-display">
                <div class="digit-group" id="cd-day">00</div>d&nbsp;
                <div class="digit-group" id="cd-hr">00</div>h&nbsp;
                <div class="digit-group" id="cd-min">00</div>m&nbsp;
                <div class="digit-group" id="cd-sec">00</div>s
            </div>
            <div class="controls">
                <button class="action-btn" onclick="startCountdown()">Start</button>
                <button class="action-btn" onclick="stopCountdown()">Stop</button>
            </div>
        </div>
    </div>

    <script>
        
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        
        function updateDigit(elementId, newValue) {
            const el = document.getElementById(elementId);
            const formattedValue = newValue.toString().padStart(2, '0');
            if (el.innerText !== formattedValue) {
                el.classList.remove('flip-anim');
                void el.offsetWidth; 
                el.classList.add('flip-anim');
                el.innerText = formattedValue;
            }
        }

        
        let swInterval;
        let swStartTime;
        let swElapsedTime = 0;
        let swRunning = false;

        function startStopwatch() {
            if (!swRunning) {
                swStartTime = Date.now() - swElapsedTime;
                swInterval = setInterval(updateStopwatch, 10);
                swRunning = true;
            }
        }

        function stopStopwatch() {
            clearInterval(swInterval);
            swRunning = false;
        }

        function resetStopwatch() {
            clearInterval(swInterval);
            swRunning = false;
            swElapsedTime = 0;
            updateDigit('sw-min', 0);
            updateDigit('sw-sec', 0);
            updateDigit('sw-ms', 0);
        }

        function updateStopwatch() {
            swElapsedTime = Date.now() - swStartTime;
            let ms = Math.floor((swElapsedTime % 1000) / 10);
            let sec = Math.floor((swElapsedTime / 1000) % 60);
            let min = Math.floor(swElapsedTime / 60000);

            updateDigit('sw-ms', ms);
            updateDigit('sw-sec', sec);
            updateDigit('sw-min', min);
            updateDigit('sw-hrs',hrs);

        let tmInterval;
        let tmTotalSeconds = 0;
        let tmRunning = false;

        function startTimer() {
            if (!tmRunning) {
                if (tmTotalSeconds === 0) {
                    let h = parseInt(document.getElementById('tm-h-in').value) || 0;
                    let m = parseInt(document.getElementById('tm-m-in').value) || 0;
                    let s = parseInt(document.getElementById('tm-s-in').value) || 0;
                    tmTotalSeconds = (h * 3600) + (m * 60) + s;
                }
                
                if (tmTotalSeconds > 0) {
                    tmInterval = setInterval(updateTimer, 1000);
                    tmRunning = true;
                }
            }
        }

        function stopTimer() {
            clearInterval(tmInterval);
            tmRunning = false;
        }

        function resetTimer() {
            clearInterval(tmInterval);
            tmRunning = false;
            tmTotalSeconds = 0;
            updateDigit('tm-hr', 0);
            updateDigit('tm-min', 0);
            updateDigit('tm-sec', 0);
        }

        function updateTimer() {
            if (tmTotalSeconds <= 0) {
                stopTimer();
                alert("Timer Finished!");
                return;
            }
            tmTotalSeconds--;
            let h = Math.floor(tmTotalSeconds / 3600);
            let m = Math.floor((tmTotalSeconds % 3600) / 60);
            let s = tmTotalSeconds % 60;

            updateDigit('tm-hr', h);
            updateDigit('tm-min', m);
            updateDigit('tm-sec', s);
        }

        
        let cdInterval;
        let cdRunning = false;

        function startCountdown() {
            if (!cdRunning) {
                cdInterval = setInterval(updateCountdown, 1000);
                cdRunning = true;
            }
        }

        function stopCountdown() {
            clearInterval(cdInterval);
            cdRunning = false;
        }

        function updateCountdown() {
            const targetDate = new Date(document.getElementById('cd-date').value).getTime();
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (isNaN(targetDate)) return;

            if (distance < 0) {
                stopCountdown();
                updateDigit('cd-day', 0);
                updateDigit('cd-hr', 0);
                updateDigit('cd-min', 0);
                updateDigit('cd-sec', 0);
                alert("Countdown Reached!");
                return;
            }

            let days = Math.floor(distance / (1000 * 60 * 60 * 24));
            let hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            let minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            let seconds = Math.floor((distance % (1000 * 60)) / 1000);

            updateDigit('cd-day', days);
            updateDigit('cd-hr', hours);
            updateDigit('cd-min', minutes);
            updateDigit('cd-sec', seconds);
        }
    </script>
</body>
</html>
